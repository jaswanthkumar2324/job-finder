name: Daily Job Scraper

on:
  schedule:
    # 12:00 PM IST is 6:30 AM UTC
    - cron: '30 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Crucial: Allows Action to commit and push changes back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'scraper/package.json'

      - name: Install Scraper Dependencies
        run: |
          cd scraper
          npm install

      - name: Run Scraper
        run: |
          node scraper/scrape.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Check if jobs.json was updated
          git add scraper/jobs.json
          git add frontend/src/data/jobs.json || true
          
          if git diff --cached --quiet; then
            echo "No changes in jobs database. Skipping commit."
          else
            git commit -m "chore: auto-update fresher jobs database [skip ci]"
            git push
          fi
