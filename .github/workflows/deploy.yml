name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write # Allows pushing the built output to the gh-pages branch

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }} # Prevents race conditions during multiple deployments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist # The build folder Vite generates
          branch: gh-pages # The target branch for GitHub Pages
